name: ESCIE CENTRAL AUDIT
on:
  push:
    paths:
      - "central-connect/**"
      - "tests/central.node.test.js"
      - "tests/repository-boundary.node.test.js"
      - ".github/workflows/central.yml"
  pull_request:
    paths:
      - "central-connect/**"
      - "tests/central.node.test.js"
      - "tests/repository-boundary.node.test.js"
      - ".github/workflows/central.yml"
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node tests/central.node.test.js
      - run: node tests/repository-boundary.node.test.js
