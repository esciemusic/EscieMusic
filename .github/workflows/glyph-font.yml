name: ESCIE Glyph Font Specimen

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  glyph-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install fonttools brotli
      - run: python fonts/build-glyph-font.py
      - name: Upload glyph font candidate
        uses: actions/upload-artifact@v6
        with:
          name: escie-glyph-font-candidate
          path: |
            fonts/release-candidate/ESCIE-GLYPH.ttf
            fonts/release-candidate/ESCIE-GLYPH.woff2
          if-no-files-found: error
