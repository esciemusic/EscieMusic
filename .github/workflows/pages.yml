name: Deploy ESCIE to GitHub Pages\n\non:\n  push:\n    branches: ["main"]\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: pages\n  cancel-in-progress: true\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Configure Pages\n        uses: actions/configure-pages@v5\n\n      - name: Validate JavaScript contracts\n        run: |\n          find . -name "*.js" -not -path "./.git/*" -print0 | xargs -0 -n1 node --check\n\n      - name: Run publishing contract tests\n        run: |\n          node tests/publishing.node.test.js\n\n      - name: Upload site artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: .\n\n  deploy:\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    runs-on: ubuntu-latest\n    needs: build\n\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n