name: Deploy ESCIE to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Audit public release source
        run: node tests/release-firewall.node.test.js

      - name: Inject transmitted release layer
        env:
          ESCIE_RELEASE_QUEUE_JSON: ${{ secrets.ESCIE_RELEASE_QUEUE_JSON }}
        run: node publishing/inject-release.js

      - name: Stamp deployed revision into public artifact
        env:
          ESCIE_DEPLOYMENT_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          const sha = process.env.ESCIE_DEPLOYMENT_SHA;
          if (!/^[0-9a-f]{40}$/i.test(sha)) throw new Error('Invalid deployment SHA');
          const html = fs.readFileSync(path, 'utf8');
          if (!/<head[^>]*>/i.test(html)) throw new Error('Public entry point has no <head>');
          if (/name=["']escie-deployment-sha["']/i.test(html)) throw new Error('Deployment SHA marker already exists');
          fs.writeFileSync(path, html.replace(/<head([^>]*)>/i, '<head$1>\n<meta name="escie-deployment-sha" content="' + sha + '">'));
          NODE

      - name: Validate JavaScript contracts
        run: |
          set -e
          while IFS= read -r -d "" file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -name "*.js" -not -path "./.git/*" -not -path "./tests/*" -print0)

      - name: Run private release injector test
        run: |
          node tests/release-injector.node.test.js

      - name: Validate generated release runtime
        run: |
          node tests/release-runtime.node.test.js

      - name: Run publishing contract tests
        run: |
          node tests/publishing.node.test.js

      - name: Run public site A-Z audit contracts
        run: |
          node --test tests/public-site-a-z.node.test.js

      - name: Run system contract tests
        run: |
          node tests/system.node.test.js

      - name: Run universal record contract tests
        run: |
          node tests/record.node.test.js

      - name: Run ingestion contract tests
        run: |
          node tests/ingestion.node.test.js

      - name: Run module-reference contract tests
        run: |
          node tests/module-references.node.test.js

      - name: Run health contract tests
        run: |
          node tests/health.node.test.js

      - name: Run site script-load contract test
        run: |
          node tests/site-loads.node.test.js
      - name: Run world-engine contract test
        run: |
          node tests/world-engine.node.test.js

      - name: Verify Pages entry points
        run: |
          set -e
          test -f index.html
          test -f data/release-runtime.js
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Run deployed ESCIE public live audit
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts
          node tests/live-public-audit.mjs

      - name: Upload deployed public audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escie-public-live-audit
          path: artifacts/
          if-no-files-found: ignore

