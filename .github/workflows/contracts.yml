name: ESCIE Contracts

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        test:
          - central.node.test.js
          - health.node.test.js
          - ingestion.node.test.js
          - module-references.node.test.js
          - performance.node.test.js
          - layer-balance.node.test.js
          - universe-contract.node.test.js
          - countdown.node.test.js
          - syntax-all.node.test.js
          - surface-architecture.node.test.js
          - publishing.node.test.js
          - record.node.test.js
          - release-firewall.node.test.js
          - release-injector.node.test.js
          - release-runtime.node.test.js
          - site-loads.node.test.js
          - system.node.test.js
          - world-engine.node.test.js
    runs-on: ubuntu-latest
    name: Contract · ${{ matrix.test }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/${{ matrix.test }}
