name: ESCIE Live Public Audit

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  live-audit:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run live public-site audit
        env:
          LIVE_URL: https://esciemusic.github.io/EscieMusic/
        run: |
          mkdir -p artifacts
          node tests/live-public-audit.mjs

      - name: Upload live public-site audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escie-public-live-audit
          path: artifacts/
          if-no-files-found: ignore
