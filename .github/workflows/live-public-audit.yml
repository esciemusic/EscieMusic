name: ESCIE Live Public Audit

on:
  workflow_run:
    workflows: ["Deploy ESCIE to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: escie-live-public-audit
  cancel-in-progress: false

jobs:
  live-audit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment completed successfully
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          test "${{ github.event.workflow_run.conclusion }}" = "success"

      - name: Checkout deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Re-run release firewall on audited revision
        run: node tests/release-firewall.node.test.js

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run live public-site audit
        env:
          LIVE_URL: https://esciemusic.github.io/EscieMusic/
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          mkdir -p artifacts
          node tests/live-public-audit.mjs

      - name: Upload live public-site audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escie-public-live-audit
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

# Audit workflow dispatch alignment: preserve the deployed-revision live gate.
