name: Promote ESCIE production font candidates

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/promote-font-candidates.yml"

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "13786507375"
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/escie-font-candidates.zip

      - name: Install font tooling
        run: python -m pip install fonttools

      - name: Promote TTF and build WOFF2 web assets
        run: |
          rm -rf /tmp/escie-font-candidates
          mkdir -p /tmp/escie-font-candidates fonts/release
          unzip -q /tmp/escie-font-candidates.zip -d /tmp/escie-font-candidates
          cp /tmp/escie-font-candidates/ESCIE.ttf fonts/release/ESCIE.ttf
          cp /tmp/escie-font-candidates/ESCIE-SIGNAL.ttf fonts/release/ESCIE-SIGNAL.ttf
          cp /tmp/escie-font-candidates/ESCIE-SCRIPT.ttf fonts/release/ESCIE-SCRIPT.ttf
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path
          import hashlib
          root = Path("fonts/release")
          for ttf in sorted(root.glob("*.ttf")):
              font = TTFont(ttf)
              font.flavor = "woff2"
              font.save(ttf.with_suffix(".woff2"))
          lines = [
              "# ESCIE Production Font Release",
              "",
              "Promoted from the validated escie-production-font-candidates workflow artifact.",
              "",
              "| Face | TTF | WOFF2 | SHA-256 |",
              "| --- | --- | --- | --- |",
          ]
          for path in sorted(root.glob("*.ttf")):
              sha = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"| {path.stem} | {path.name} | {path.with_suffix('.woff2').name} | {sha} |")
          (root / "MANIFEST.md").write_text("\n".join(lines) + "\n")
          PY

      - name: Validate promoted fonts
        run: |
          python fonts/validate-production-fonts.py
          test -f fonts/release/ESCIE.ttf
          test -f fonts/release/ESCIE-SIGNAL.ttf
          test -f fonts/release/ESCIE-SCRIPT.ttf
          test -f fonts/release/ESCIE.woff2
          test -f fonts/release/ESCIE-SIGNAL.woff2
          test -f fonts/release/ESCIE-SCRIPT.woff2

      - name: Commit promoted fonts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts/release
          if git diff --cached --quiet; then
            echo "No font release changes to commit."
            exit 0
          fi
          git commit -m "Public: promote validated ESCIE production fonts"
          git push

# Promotion is intentionally path-scoped to prevent release loops.
