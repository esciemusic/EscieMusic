<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ESCIE — Black Canvas</title>
<style>
  :root,
  html,
  body {
    background:#000;
    color:#fff;
  }
  html,
  body {
    width:100%;
    min-height:100%;
    margin:0;
    padding:0;
  }
  body {
    min-height:100svh;
    overflow-x:hidden;
  }

  .site-header {
    min-height:58px;
    width:100%;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    box-sizing:border-box;
    padding:0 24px;
    border-bottom:1px solid rgba(255,255,255,.08);
    font:500 10px/1 Arial,sans-serif;
    letter-spacing:.16em;
  }

  .header-left,
  .header-center,
  .header-right {
    display:flex;
    align-items:center;
  }

  .header-left { justify-content:flex-start; }
  .header-center { justify-content:center; gap:0; }
  .header-right { justify-content:flex-end; }

  .header-symbol,
  .header-control,
  .header-index {
    color:#fff;
    background:transparent;
    border:0;
    font:inherit;
    letter-spacing:inherit;
    text-transform:uppercase;
  }

  .header-symbol {
    padding:8px 0;
    font-size:9px;
    letter-spacing:.22em;
  }

  .header-controls {
    display:flex;
    align-items:center;
  }

  .header-control {
    min-width:34px;
    min-height:30px;
    padding:0 8px;
    color:rgba(255,255,255,.62);
  }

  .header-index {
    padding:8px 0;
    color:rgba(255,255,255,.72);
    font-size:9px;
    letter-spacing:.22em;
  }

  @media(max-width:600px) {
    .site-header { padding:0 14px; min-height:54px; }
    .header-control { min-width:30px; padding:0 6px; font-size:8px; }
    .header-symbol,
    .header-index { font-size:8px; }
  }
</style>
</head>
<body>
  <header class="site-header" aria-label="ESCIE header">
    <div class="header-left">
      <span class="header-symbol">ESCIE SYMBOL</span>
    </div>

    <div class="header-center">
      <div class="header-controls" aria-label="Language and light controls">
        <button class="header-control" type="button">EN</button>
        <button class="header-control" type="button">FR</button>
        <button class="header-control" type="button">ES</button>
        <button class="header-control" type="button">LIGHT</button>
      </div>
    </div>

    <div class="header-right">
      <button class="header-index" type="button">INDEX</button>
    </div>
  </header>
</body>
</html>
