<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ESCIE — Black Canvas</title>
<style>
  :root,html,body{background:#000;color:#fff}
  html,body{width:100%;min-height:100%;margin:0;padding:0}
  body{min-height:220svh;overflow-x:hidden}
  .site-header{min-height:58px;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;box-sizing:border-box;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.08);font:500 10px/1 Arial,sans-serif;letter-spacing:.16em}
  .header-left,.header-center,.header-right{display:flex;align-items:center}
  .header-left{justify-content:flex-start}.header-center{justify-content:center}.header-right{justify-content:flex-end}
  .header-symbol,.header-control,.header-index{color:#fff;background:transparent;border:0;font:inherit;letter-spacing:inherit;text-transform:uppercase}
  .header-symbol{padding:8px 0;font-size:9px;letter-spacing:.22em}
  .header-controls{display:flex;align-items:center}
  .header-control{min-width:34px;min-height:30px;padding:0 8px;color:rgba(255,255,255,.68)}
  .header-index{padding:8px 0;color:rgba(255,255,255,.76);font-size:9px;letter-spacing:.22em}

  .hero{min-height:calc(100svh - 58px);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(72px,13vh,150px) 24px 56px;position:relative}
  .hero-name{margin:0;font:500 clamp(38px,8vw,76px)/.95 Arial,sans-serif;letter-spacing:.08em}
  .hero-statement{margin:26px 0 0;max-width:430px;font:500 clamp(16px,3.4vw,28px)/1.15 Arial,sans-serif;letter-spacing:.04em}
  .hero-now{margin-top:42px;min-height:42px;padding:0 20px;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.24);font:500 10px/1 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}
  .hero-location{margin:34px 0 0;font:500 10px/1 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.76)}
  .hero-skyline{width:min(760px,100%);height:110px;margin-top:24px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .hero-skyline span{display:block;width:10px;background:rgba(255,255,255,.22);margin:0 2px}
  .hero-skyline span:nth-child(1){height:25px}.hero-skyline span:nth-child(2){height:43px}.hero-skyline span:nth-child(3){height:34px}.hero-skyline span:nth-child(4){height:66px}.hero-skyline span:nth-child(5){height:48px}.hero-skyline span:nth-child(6){height:82px}.hero-skyline span:nth-child(7){height:57px}.hero-skyline span:nth-child(8){height:72px}.hero-skyline span:nth-child(9){height:39px}.hero-skyline span:nth-child(10){height:92px}.hero-skyline span:nth-child(11){height:52px}.hero-skyline span:nth-child(12){height:31px}
  .hero-backdoors{margin-top:auto;display:flex;gap:28px;align-items:center;justify-content:center;font:500 9px/1 Arial,sans-serif;letter-spacing:.16em;color:rgba(255,255,255,.46);text-transform:uppercase}
  .hero-backdoors a{color:inherit;text-decoration:none;padding:10px 4px}

  @media(max-width:600px){
    .site-header{min-height:54px;padding:0 14px}
    .header-control{min-width:30px;padding:0 6px;font-size:8px}
    .header-symbol,.header-index{font-size:8px}
    .hero{min-height:calc(100svh - 54px);padding:68px 18px 34px}
    .hero-name{font-size:42px}
    .hero-statement{margin-top:22px;font-size:18px;max-width:320px}
    .hero-now{margin-top:34px;min-height:40px}
    .hero-location{margin-top:28px;font-size:9px;letter-spacing:.16em}
    .hero-skyline{height:82px;margin-top:18px}
    .hero-skyline span{width:7px;margin:0 1px}
    .hero-backdoors{gap:15px;flex-wrap:wrap}
  }
</style>
</head>
<body>
  <header class="site-header" aria-label="ESCIE header">
    <div class="header-left"><span class="header-symbol">ESCIE SYMBOL</span></div>
    <div class="header-center">
      <div class="header-controls" aria-label="Language and light controls">
        <button class="header-control" type="button">EN</button><button class="header-control" type="button">FR</button><button class="header-control" type="button">ES</button><button class="header-control" type="button">LIGHT</button>
      </div>
    </div>
    <div class="header-right"><button class="header-index" type="button">INDEX</button></div>
  </header>

  <main>
    <section class="hero" aria-label="ESCIE hero">
      <h1 class="hero-name">ESCIE</h1>
      <p class="hero-statement">A GOOD PERSON,<br>I'M JUST NOT NICE.</p>
      <button class="hero-now" type="button">PRESENT STATE / NOW</button>
      <p class="hero-location">MONTRÉAL, QUÉBEC, CANADA</p>
      <div class="hero-skyline" aria-label="Montréal skyline">
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <nav class="hero-backdoors" aria-label="Back door nodes">
        <a href="#world">WORLD</a><a href="#art">ART</a><a href="#web">WEB</a><a href="#archives">ARCHIVES</a>
      </nav>
    </section>
  </main>
</body>
</html>
